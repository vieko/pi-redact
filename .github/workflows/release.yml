name: release

# Tag-driven release: pushing a vX.Y.Z tag gates, publishes @vieko/pi-redact to npm
# via OIDC trusted publishing (no token, no OTP, with provenance), and cuts
# the GitHub release. One-time setup: configure the trusted publisher for
# @vieko/pi-redact on npmjs.com (GitHub Actions, repo vieko/pi-redact, workflow
# release.yml).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so release notes can diff from the previous tag
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner ships older.
      - run: npm install -g npm@latest
      - run: npm ci
      # The same gate as CI: a tag only ships if it is green.
      - run: npm run check
        env:
          REDACT_PERF_LIMIT_MS: 10000
      # Guard: the tag must match the package version we are about to publish.
      - name: Verify tag matches package version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag v$tag does not match @vieko/pi-redact version $pkg" >&2
            exit 1
          fi
      # Skip publish when this exact version is already on the registry
      # (e.g. a retroactive tag for a manually published release); still
      # cut the GitHub release below.
      - name: Check whether this version is already published
        id: published
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "@vieko/pi-redact@$pkg" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # OIDC trusted publishing: no NODE_AUTH_TOKEN, no OTP; provenance is automatic.
      - run: npm publish
        if: steps.published.outputs.exists == 'false'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
